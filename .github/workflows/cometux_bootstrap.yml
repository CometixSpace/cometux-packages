# Cometux-specific workflow (not from upstream): builds bootstrap
# archives from local package sources via build-bootstraps.sh, which is
# designed for forked apps and needs no published apt repo. Kept as a
# separate file so upstream rebases never conflict.
name: Cometux bootstrap

on:
  workflow_dispatch:
    inputs:
      architectures:
        description: "Space-separated architectures to build"
        required: false
        default: "aarch64"

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: ./scripts/free-space.sh

      # Our scripts/ diverges from the upstream ghcr image (extra SDK
      # components for building termux-am from source, which the
      # restricted AppArmor profile forbids installing at build time),
      # so build the image locally instead of pulling.
      - name: Build docker image
        run: |
          docker build -t ghcr.io/termux/package-builder:latest scripts/
          docker buildx prune -af

      - name: Build bootstrap archives from source
        run: |
          ./scripts/run-docker.sh ./scripts/build-bootstraps.sh \
            --architectures "${{ inputs.architectures }}"

      - name: Collect artifacts
        run: |
          mkdir -p bootstrap-output
          find . -maxdepth 2 -name 'bootstrap-*.zip' -exec mv {} bootstrap-output/ \;
          ls -la bootstrap-output/

      - name: Upload bootstrap archives
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-archives
          path: bootstrap-output/*.zip
          if-no-files-found: error

      # The same run builds every deb in the dependency closure; publish
      # them as an artifact so the apt repository can be refreshed from
      # the exact bits that went into the bootstrap. Tarred first: deb
      # names with epoch versions contain ':' which upload-artifact
      # rejects (same reason packages.yml tars its debs).
      - name: Pack built debs
        run: |
          if ls output/*.deb >/dev/null 2>&1; then
            tar cf debs.tar -C output .
          fi
      - name: Upload built debs
        uses: actions/upload-artifact@v4
        with:
          name: debs
          path: debs.tar
          if-no-files-found: warn
