# Cometux-specific workflow (not from upstream). Assembles bootstrap
# archives the way upstream does: pull already-built debs from the
# self-hosted apt repository rather than compiling the world locally.
#
# The older build-bootstraps.sh path (build every package from source,
# then extract) is what produced the ~135MB archives carrying build
# residue and a broken dpkg-perl; generate-bootstraps.sh installs only
# the runtime closure and lands around 30MB. It needs a published
# repository, which is why it could not be used before group B.
#
# Kept as a separate file so upstream rebases never conflict.
name: Cometux bootstrap

on:
  workflow_dispatch:
    inputs:
      architectures:
        description: "Comma-separated architectures to assemble"
        required: false
        # Only aarch64 is published to the repository, so it is the only
        # architecture that can be assembled from it.
        default: "aarch64"
      repository:
        description: "APT repository base url to pull packages from"
        required: false
        default: "https://cometixspace.github.io/cometux-packages/termux-main"

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # generate-bootstraps.sh runs on the host: it only needs to fetch
      # debs and repack them, so no builder image is involved.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils curl jq xz-utils zip

      - name: Assemble bootstrap archives
        run: |
          ./scripts/generate-bootstraps.sh \
            --architectures "${{ inputs.architectures }}" \
            --repository "${{ inputs.repository }}"

      - name: Collect artifacts
        run: |
          mkdir -p bootstrap-output
          find . -maxdepth 2 -name 'bootstrap-*.zip' -exec mv {} bootstrap-output/ \;
          ls -la bootstrap-output/

      # Size is the whole point of this path, so make it visible in the
      # run summary instead of only inside the artifact.
      - name: Report archive sizes
        run: |
          {
            echo "| archive | size |"
            echo "|---|---|"
            for f in bootstrap-output/*.zip; do
              echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bootstrap archives
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-archives
          path: bootstrap-output/*.zip
          if-no-files-found: error
